name: Comprobar fuentes visuales

on:
  push:
    branches: [main]
    paths: ["scripts/**", "assets/**", ".github/workflows/validate-assets.yml"]
  pull_request:
    paths: ["scripts/**", "assets/**", ".github/workflows/validate-assets.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Instalar generador
        run: python -m pip install -r scripts/requirements.txt
      - name: Comprobar SVG publicados
        run: python scripts/generate_assets.py --check
      - name: Comprobar opciones de estadísticas
        run: python scripts/stats_options.py
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Comprobar la culebrita
        run: node scripts/snake.mjs --test
