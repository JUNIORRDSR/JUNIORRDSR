# Genera la culebrita que se come el calendario de contribuciones y la publica en la rama `output`.
name: Culebrita de contribuciones

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#1F2328&color_dots=#EBEDF0,#FFD9C7,#FFB08A,#FF7F45,#FF4F00
            dist/snake-dark.svg?color_snake=#E6EDF3&color_dots=#161B22,#4A2414,#7A3415,#C24A12,#FF6A2B

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
