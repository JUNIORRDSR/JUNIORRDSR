name: Estadísticas del perfil

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/profile.json", "scripts/stats_options.py", ".github/workflows/profile-stats.yml"]

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Preparar opciones
        id: options
        run: python scripts/stats_options.py >> "$GITHUB_OUTPUT"

      - name: Generar tarjeta oscura
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          path: assets/dark/stats.svg
          options: ${{ steps.options.outputs.dark }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generar tarjeta clara
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          path: assets/light/stats.svg
          options: ${{ steps.options.outputs.light }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Publicar tarjetas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dark/stats.svg assets/light/stats.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(profile): refresh GitHub statistics"
          git pull --rebase origin main
          git push origin HEAD:main
