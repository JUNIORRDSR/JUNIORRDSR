name: Estadísticas del perfil

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-stats.yml"]

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Generar tarjeta oscura
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          path: assets/dark/stats.svg
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide=contribs&locale=es&custom_title=Registro%20en%20GitHub&border_radius=0&bg_color=0D1117&border_color=30363D&title_color=E6EDF3&icon_color=FF6A2B&text_color=E6EDF3&ring_color=FF6A2B
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generar tarjeta clara
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          path: assets/light/stats.svg
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide=contribs&locale=es&custom_title=Registro%20en%20GitHub&border_radius=0&bg_color=FFFFFF&border_color=D0D7DE&title_color=1F2328&icon_color=FF4F00&text_color=1F2328&ring_color=FF4F00
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Publicar tarjetas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dark/stats.svg assets/light/stats.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(profile): refresh GitHub statistics"
          git pull --rebase origin main
          git push origin HEAD:main
